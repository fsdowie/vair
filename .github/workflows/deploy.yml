name: Deploy VAIR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest --prod --token $VERCEL_TOKEN

  deploy-supabase:
    name: Deploy Supabase Functions
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          # Functions that verify the caller's JWT themselves (manual fetch + Authorization header)
          # are deployed with --no-verify-jwt so the gateway doesn't also require an apikey header.
          for fn in ask-referee list-users get-question-logs submit-report get-reports \
                    process-report extract-game set-admin-role delete-user \
                    end-date-user check-registration get-recent-questions \
                    generate-misconduct-report; do
            supabase functions deploy "$fn" --no-verify-jwt
          done
          # Functions invoked via supabase.functions.invoke(), which attaches a verified session JWT.
          for fn in generate-referee-profile get-usage-stats; do
            supabase functions deploy "$fn"
          done
